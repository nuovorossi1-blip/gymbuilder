name: Build APK for Vercel

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/gymbuilder.apk'
      - 'public/version.json'
      - 'android/app/debug.keystore'

permissions:
  contents: write

concurrency:
  group: build-apk-main
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://geqhxhgrameaugawmaej.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_dYZx352-EazyIIMAqS2IDA_ZFsqv3nU

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Ensure stable debug keystore
        run: |
          if [ -f android/app/debug.keystore ]; then
            echo "Debug keystore already present, reusing it."
            exit 0
          fi
          keytool -genkeypair -v -keystore android/app/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=GymBuilder Debug,O=GymBuilder,C=IT"

      - name: Install dependencies
        run: npm ci

      - name: Synchronize Capacitor Android
        run: npm run cap:sync

      - name: Compute build version
        id: version
        run: |
          CODE="${{ github.run_number }}"
          NAME="1.0.${{ github.run_number }}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Bump Android version for this build
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${{ steps.version.outputs.code }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.name }}\"/" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: bash gradlew assembleDebug

      - name: Copy APK for Vercel
        run: cp android/app/build/outputs/apk/debug/app-debug.apk public/gymbuilder.apk

      - name: Update version.json
        run: |
          cat > public/version.json <<EOF
          {
            "version": "${{ steps.version.outputs.name }}",
            "versionCode": ${{ steps.version.outputs.code }},
            "apkUrl": "https://gymbuilder-lemon.vercel.app/gymbuilder.apk",
            "releaseUrl": "https://github.com/nuovorossi1-blip/gymbuilder/releases/latest",
            "notes": "Build automatica dal commit ${{ github.sha }}.",
            "mandatory": false
          }
          EOF

      - name: Commit APK to main
        run: |
          git add public/gymbuilder.apk public/version.json android/app/debug.keystore
          if git diff --cached --quiet -- public/gymbuilder.apk public/version.json android/app/debug.keystore; then
            echo "APK unchanged; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Android APK [skip ci]"
          git push origin HEAD:main

      - name: Deploy APK to Vercel
        run: npx --yes vercel@59.1.3 deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
