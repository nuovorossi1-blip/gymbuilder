name: Build APK for Vercel

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'public/gymbuilder.apk'

permissions:
  contents: write

concurrency:
  group: build-apk-main
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Synchronize Capacitor Android
        run: npm run cap:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Copy APK for Vercel
        run: cp android/app/build/outputs/apk/debug/app-debug.apk public/gymbuilder.apk

      - name: Commit APK to main
        run: |
          git add public/gymbuilder.apk
          if git diff --cached --quiet -- public/gymbuilder.apk; then
            echo "APK unchanged; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Android APK [skip ci]"
          git push origin HEAD:main
