name: Android Release

on:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run cap:sync
      # Lo step "Strip previous release APK" non serve piu': dal 18/09/2026 l'APK non
      # e' piu' committato in public/, quindi non finisce dentro dist/ ne' negli asset.

      # versionCode/versionName in build.gradle restano fermi a 1 / 1.0.0 perche' li
      # scrive al volo il workflow debug. Senza questo passo la release firmata
      # uscirebbe come 1.0.0: piu' BASSA di qualunque build debug (1.0.N), e Android
      # rifiuterebbe l'installazione. La base 1000 tiene le release sopra i debug.
      - name: Compute release version
        id: version
        run: |
          CODE=$(( 1000 + ${{ github.run_number }} ))
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=1.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Write version into build.gradle
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${{ steps.version.outputs.code }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.name }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/gymbuilder-release.jks
      - name: Build signed APK
        working-directory: android
        env:
          GYMBUILDER_STORE_FILE: gymbuilder-release.jks
          GYMBUILDER_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          GYMBUILDER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GYMBUILDER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash gradlew assembleRelease
      - name: Prepare release asset
        run: cp android/app/build/outputs/apk/release/app-release.apk GymBuilder.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: GymBuilder.apk
          generate_release_notes: true
