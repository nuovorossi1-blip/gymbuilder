name: Android Release

on:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run cap:sync
      - name: Strip previous release APK from bundled web assets
        # Vedi build-apk.yml: public/gymbuilder.apk finisce in dist/ (copia verbatim di
        # public/ fatta da Vite) e poi negli asset Android via cap sync, incorporando la APK
        # precedente dentro quella nuova a ogni release.
        run: rm -f android/app/src/main/assets/public/gymbuilder.apk
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/gymbuilder-release.jks
      - name: Build signed APK
        working-directory: android
        env:
          GYMBUILDER_STORE_FILE: gymbuilder-release.jks
          GYMBUILDER_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          GYMBUILDER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GYMBUILDER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash gradlew assembleRelease
      - name: Prepare release asset
        run: cp android/app/build/outputs/apk/release/app-release.apk GymBuilder.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: GymBuilder.apk
          generate_release_notes: true
